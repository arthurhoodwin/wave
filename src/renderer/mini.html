<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.vkuserphoto.ru https://*.userapi.com https://*.vk.me; object-src 'none'; base-uri 'none'">
  <title>Wave · Мини-плеер</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="mini.css">
  <link rel="stylesheet" href="mini-design.css">
  <link rel="stylesheet" href="refinements.css">
  <link rel="stylesheet" href="polish.css">
  <link rel="stylesheet" href="interface.css">
  <link rel="stylesheet" href="motion-details.css">
  <link rel="stylesheet" href="mini-island.css">
</head>
<body class="mini-window" data-expanded="false" data-motion="false">
  <main class="island-shell" aria-label="Мини-плеер Wave">
    <header id="island-compact" class="island-compact">
      <div class="island-grip" title="Перетащить мини-плеер">
        <span id="island-art" aria-hidden="true"><img src="../../assets/icons/wave.png" alt=""></span>
        <span id="island-track">Wave</span>
        <span class="island-signal" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <button type="button" id="island-shortcut" aria-expanded="false" aria-controls="island-panel" aria-label="Раскрыть мини-плеер"><kbd id="island-key-hint"></kbd></button>
    </header>
    <section id="island-panel" aria-label="Управление воспроизведением" inert>
      <div id="island-content">
        <div class="song">
          <div id="art" aria-hidden="true">≋</div>
          <div class="meta">
            <strong id="title">Выберите песню в Wave</strong>
            <span id="artist"></span>
          </div>
          <button id="hide" aria-label="Свернуть мини-плеер" title="Свернуть мини-плеер"><kbd id="island-hide-hint"></kbd><span class="island-chevron" data-icon="down" aria-hidden="true"></span></button>
        </div>
        <div class="progress">
          <span id="position">0:00</span>
          <input id="seek" type="range" min="0" max="0" value="0" aria-label="Позиция воспроизведения" disabled>
          <span id="duration">0:00</span>
        </div>
        <div class="mini-transport" role="group" aria-label="Управление воспроизведением">
          <button id="previous" aria-label="Предыдущий трек" data-icon="previous" disabled></button>
          <button id="toggle" aria-label="Воспроизвести" data-icon="play" disabled></button>
          <button id="next" aria-label="Следующий трек" data-icon="next" disabled></button>
        </div>
        <div class="island-tools" role="group" aria-label="Лайк, перемешивание и громкость">
          <button id="heart" aria-label="Добавить в «Мне нравится»" aria-pressed="false" data-icon="heart" disabled></button>
          <button id="shuffle" aria-label="Перемешать список" aria-pressed="false" data-icon="shuffle" disabled></button>
          <label class="mini-volume">
            <span data-icon="volume" aria-hidden="true"></span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Громкость">
            <output id="volume-value" for="volume">50%</output>
          </label>
        </div>
        <p id="error" role="status"></p>
      </div>
    </section>
  </main>
  <script src="motion.js"></script>
  <script src="ui-polish.js"></script>
  <script src="icons.js"></script>
  <script src="toasts.js"></script>
  <script src="volume-writer.js"></script>
  <script src="image-cache.js"></script>
  <script src="mini.js"></script>
  <script src="mini-island.js"></script>
  <script src="keyboard.js"></script>
  <script src="window-chrome.js"></script>
  <script src="select-controls.js"></script>
  <script src="motion-details.js"></script>
</body>
</html>
